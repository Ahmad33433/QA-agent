[project]
name = "qa-agent-backend"
version = "0.2.0"
description = "FastAPI backend for an LLM agent that tests web pages with Playwright and Locust."
readme = "../README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-dotenv>=1.0",
    "langchain>=1.0",
    "langchain-openai>=1.0",
    "langsmith>=0.4",
    "playwright>=1.50",
    "locust>=2.30",
    "mcp>=1.30.0",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-google-genai>=4.5.2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
